---
- name: Actualizar Debian 11 (bullseye) a Debian 12 (bookworm) y verificar Apache
  hosts: debian_servers
  become: yes

  tasks:
    - name: Cambiar repositorios de bullseye a bookworm
      replace:
        path: /etc/apt/sources.list
        regexp: 'bullseye'
        replace: 'bookworm'

    - name: Actualizar caché de paquetes
      apt:
        update_cache: yes

    - name: Actualizar paquetes base (sin reiniciar)
      apt:
        upgrade: yes
        autoremove: yes
        autoclean: yes

    - name: Chequear si reboot es necesario
      stat:
        path: /var/run/reboot-required
      register: reboot_file

    - name: Reiniciar si es necesario
      reboot:
        reboot_timeout: 600
      when: reboot_file.stat.exists

    - name: Esperar que el host vuelva online
      wait_for_connection:
        delay: 10
        timeout: 300
      when: reboot_file.stat.exists

    - name: Completar actualización dist-upgrade
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Verificar que apache2 está instalado
      apt:
        name: apache2
        state: present

    - name: Asegurarse que apache2 está corriendo y habilitado
      service:
        name: apache2
        state: started
        enabled: yes
