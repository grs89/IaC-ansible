---
# Role: kvm_vms (Versión Zstd)
# Descripción: Despliegue de máquinas virtuales con Talos OS (soporte .zst)

- name: Asegurar que los directorios de almacenamiento existen
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ vms_iso_pool }}"
    - "{{ vms_disk_pool }}"

- name: Instalar herramientas necesarias (incluyendo zstd)
  apt:
    name:
      - xz-utils
      - qemu-utils
      - zstd
    state: present

- name: Descargar imagen de Talos OS
  get_url:
    url: "{{ vms_base_image_url }}"
    dest: "{{ vms_iso_pool }}/talos-base.raw{{ '.zst' if vms_base_image_url.endswith('.zst') else '.xz' }}"
    mode: '0644'

- name: Descomprimir imagen de Talos (.zst)
  shell: |
    zstd -d -f {{ vms_iso_pool }}/talos-base.raw.zst -o {{ vms_iso_pool }}/talos-base.raw
  when: vms_base_image_url.endswith('.zst')
  args:
    creates: "{{ vms_iso_pool }}/talos-base.raw"

- name: Descomprimir imagen de Talos (.xz)
  shell: |
    xz -d -c {{ vms_iso_pool }}/talos-base.raw.xz > {{ vms_iso_pool }}/talos-base.raw
  when: vms_base_image_url.endswith('.xz')
  args:
    creates: "{{ vms_iso_pool }}/talos-base.raw"

- name: Desplegar cada nodo de Talos
  include_tasks: deploy_single_vm.yml
  loop: "{{ vms_list }}"
  loop_control:
    loop_var: vm_item
