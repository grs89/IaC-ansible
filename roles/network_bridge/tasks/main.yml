---
# Role: network_bridge (Versión Debian)
# Descripción: Configurar un puente de red (br0) usando /etc/network/interfaces

- name: Instalar herramientas de bridge en Debian
  apt:
    name: bridge-utils
    state: present

- name: Hacer backup de la configuración de red actual

  copy:
    src: /etc/network/interfaces
    dest: /etc/network/interfaces.bak
    remote_src: yes
  ignore_errors: yes

- name: Generar configuración de interfaces con Bridge
  template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    mode: '0644'
  register: network_config

- name: Reiniciar red para activar el Bridge (Transición rápida)
  shell: |
    /usr/sbin/ifdown --force {{ ansible_default_ipv4.interface }} || true
    /usr/sbin/ifup br0
  async: 60
  poll: 0
  when: network_config.changed


